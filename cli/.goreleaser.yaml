version: 2
project_name: ableton-pp-cli
changelog:
  disable: true
builds:
  - id: ableton-pp-cli
    main: ./cmd/ableton-pp-cli
    binary: ableton-pp-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X ableton-pp-cli/internal/cli.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
  - id: ableton-pp-mcp
    main: ./cmd/ableton-pp-mcp
    binary: ableton-pp-mcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_amd64
      - linux_arm64
      - windows_amd64
      - windows_arm64
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
brews:
  - name: ableton-pp-cli
    repository:
      owner: marcodhoward
      name: homebrew-tap
    homepage: "https://github.com/marcodhoward/ableton-pp-cli"
    description: "Control Ableton Live from the terminal by track and device name, with backups for note edits and a journal of every change."
    install: |
      bin.install "ableton-pp-cli"
      bin.install "ableton-pp-mcp"
